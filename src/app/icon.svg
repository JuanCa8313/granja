<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#F59E0B" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="#0B132B" stroke="#334155" stroke-width="3"/>

  <!-- Silueta de Montañas (2.200 msnm) -->
  <path d="M100,340 L190,210 L270,300 L340,190 L420,340 Z" fill="url(#mountainGrad)" opacity="0.6"/>

  <g filter="url(#glow)" transform="translate(0, -5)">
    <!-- Casa / Finca Matriz -->
    <!-- Techo dos aguas -->
    <polygon points="256,130 140,230 170,230 256,155 342,230 372,230" fill="url(#goldGrad)"/>
    <!-- Paredes -->
    <rect x="170" y="230" width="172" height="130" fill="#F8FAFC" rx="4"/>
    <!-- Puerta de madera tipo establo -->
    <path d="M226,270 L286,270 L286,360 L226,360 Z" fill="#92400E" rx="4"/>
    <path d="M228,272 L284,358 M284,272 L228,358" stroke="#FDE68A" stroke-width="2"/>
    <!-- Ventanas -->
    <rect x="185" y="255" width="28" height="28" rx="3" fill="#38BDF8"/>
    <rect x="299" y="255" width="28" height="28" rx="3" fill="#38BDF8"/>
    <!-- Sol / Luna andina -->
    <circle cx="256" cy="115" r="16" fill="#FDE047"/>
  </g>

  <!-- Tag inferior GRANJA OS -->
  <rect x="146" y="416" width="220" height="34" rx="17" fill="url(#goldGrad)" />
  <text x="256" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#0F172A" text-anchor="middle" letter-spacing="2">GRANJA OS HUB</text>
</svg>